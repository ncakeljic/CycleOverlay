# Neue Version veröffentlichen:
#   1. __version__ in src/cycle_overlay/__init__.py und CHANGELOG.md anpassen, committen, pushen
#   2. git tag v1.8.0 && git push --tags
# Dieser Ablauf baut dann den Windows-Installer und legt ein GitHub-Release mit dem
# CHANGELOG-Abschnitt als Text an. Die installierten Apps finden das Update darüber.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}  # zum Ausprobieren von Hand starten (baut, veröffentlicht aber nichts)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag passt zur Version im Quellcode
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: python packaging/release_notes.py --check "${{ github.ref_name }}"

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - uses: astral-sh/setup-uv@v6

      - name: Installer bauen
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - name: Testergebnis aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-windows
          path: dist/tests_windows.txt
          if-no-files-found: ignore

      - name: Installer als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: packaging/windows/Output/CycleOverlay-Setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: out

      - name: Release-Text aus CHANGELOG.md
        run: python3 packaging/release_notes.py "${{ github.ref_name }}" > notes.md

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: CycleOverlay ${{ github.ref_name }}
          body_path: notes.md
          files: out/*.exe
